---

- name: "1.2.1.1 | AUDIT | Ensure the source.list and .source files use the Signed-By option"
  when: deb13cis_rule_1_2_1_1
  tags:
    - level1-server
    - level1-workstation
    - audit
    - rule_1.2.1.1
    - NIST800-53R5_SI-2
  vars:
    warn_control_id: '1.1.2.1'
  block:
    - name: "1.2.1.1 | AUDIT | Ensure the source.list and .source files use the Signed-By option"
      ansible.builtin.shell: grep -PRLs -- '^([^#\n\r]+)?\bSigned-By\b' /etc/apt/sources.list /etc/apt/sources.list.d/*.{list,sources}
      changed_when: false
      failed_when: discovered_apt_signed_by_missing.rc not in [ 0, 1, 2 ]
      register: discovered_apt_signed_by_missing

    - name: "1.2.1.1 | AUDIT | Ensure the source.list and .source files use the Signed-By option"
      when: discovered_apt_signed_by_missing.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! Check apt sources are using Signed-By option for list of source files"

    - name: "1.2.1.1 | AUDIT | Ensure the source.list and .source files use the Signed-By option"
      when: discovered_apt_signed_by_missing.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "1.2.1.2 | AUDIT | Ensure weak dependencies are configured"
  when: deb13cis_rule_1_2_1_2
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.2
    - NIST800-53R5_SI-2
  block:
    - name: "1.2.1.2 | AUDIT | Ensure weak dependencies are configured | change configs not expected"
      when: "item.path != /etc/apt/apt.conf.d/60-no-weak-dependencies"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: ^APT::Install-(Recommends|Suggests) "1"
        replace: '#APT::Install-\1 "0"'
      loop: "{{ prelim_apt_conf_files.files }}"

    - name: "1.2.1.2 |  PATCH | Ensure weak dependencies are configured | add default template"
      ansible.builtin.template:
        src: etc/apt/apt.conf.d/60-no-weak-dependencies.j2
        dest: /etc/apt/apt.conf.d/60-no-weak-dependencies
        owner: root
        group: root
        mode: 'u-x,go-wx'

- name: "1.2.1.3 | PATCH | Ensure access to gpg key files are configured"
  when: deb13cis_rule_1_2_1_3
  tags:
    - level2-server
    - level2-workstation
    - audit
    - rule_1.2.1.3
  block:
    - name: "1.2.1.3 | AUDIT | Ensure access to gpg key files are configured | find gpg keyfiles"
      ansible.builtin.find:
        path: /usr/share/keyrings
        patterns: "*.gpg"
      register: discovered_gpg_files

    - name: "1.2.1.3 | PATCH | Ensure access to gpg key files are configured | adjust gpg files perms"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop: "{{ discovered_gpg_files.files }}"

    - name: "1.2.1.3 | PATCH | Ensure access to gpg key files are configured | adjust sources"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop: "{{ prelim_apt_repo_files.files }}"

- name: "1.2.1.4 | PATCH | Ensure access to /etc/apt/trusted.gpg.d directory is configured"
  when: deb13cis_rule_1_2_1_4
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.4
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: "1.2.1.5 | PATCH | Ensure access to /etc/apt/auth.conf.d directory is configured"
  when: deb13cis_rule_1_2_1_5
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.5
  ansible.builtin.file:
    path: /etc/apt/auth.conf.d
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: "1.2.1.6 | PATCH | Ensure access to files in the /etc/apt/auth.conf.d/ directory is configured"
  when: deb13cis_rule_1_2_1_6
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.6
  block:
    - name: "1.2.1.6 | AUDIT | Ensure access to files in the /etc/apt/auth.conf.d/ directory is configured | find files"
      ansible.builtin.find:
        path: /etc/apt/auth.conf.d
        patterns: "*.conf"
      register: discovered_auth_conf_d

    - name: "1.2.1.6 | PATCH | Ensure access to files in the /etc/apt/auth.conf.d/ directory is configured | file permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop: "{{ discovered_auth_conf_d.files }}"

- name: "1.2.1.7 | PATCH | Ensure access to /usr/share/keyrings directory is configured"
  when: deb13cis_rule_1_2_1_7
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.7
  ansible.builtin.file:
    path: '/usr/share/keyrings'
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: "1.2.1.8 | PATCH | Ensure access to /etc/apt/sources.list.d directory is configured"
  when: deb13cis_rule_1_2_1_8
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.8
  ansible.builtin.file:
    path: /etc/apt/sources.list.d
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: "1.2.1.9 | PATCH | Ensure access to files in /etc/apt/sources.list.d are configured"
  when: deb13cis_rule_1_2_1_9
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.2.1.9
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: 'u-x,go-wx'
  loop: "{{ prelim_apt_repo_files.files }}"
