---

- name: "1.3.1.1 | PATCH | Ensure apparmor packages are installed"
  when:
    - deb13cis_rule_1_3_1_1
    - not deb13cis_apparmor_disable
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.1
    - NIST800-53R5_AC-3
  ansible.builtin.package:
    name:
      - apparmor
      - apparmor-utils
    state: present

- name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled"
  when:
    - deb13cis_rule_1_3_1_2
    - not deb13cis_apparmor_disable
  tags:
    - level1-server
    - level1-workstation
    - scored
    - patch
    - rule_1.3.1.2
    - NIST800-53R5_AC-3
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: 'apparmor=0'
    line: ''
  notify: Update-grub

- name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing"
  when:
    - deb13cis_rule_1_3_1_3
    - not deb13cis_apparmor_disable
  tags:
    - level2-server
    - level2-workstation
    - scored
    - patch
    - rule_1.3.1.3
    - apparmor
    - NIST800-53R5_AC-3
  block:
    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Make sure that 1.3.1.4 is not run"
      ansible.builtin.set_fact:
        control_1_3_1_3_was_run: true
      changed_when: false

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Get pre apply enforce count"
      ansible.builtin.shell: apparmor_status |  grep "profiles are in enforce mode" | tr -d -c 0-9
      changed_when: false
      failed_when: false
      register: discovered_apparmor_pre_count

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Apply enforcing to /etc/apparmor.d profiles"
      ansible.builtin.shell: aa-enforce /etc/apparmor.d/*
      changed_when: false
      failed_when: false

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | Get post apply enforce count"
      ansible.builtin.shell: apparmor_status |  grep "profiles are in enforce mode" | tr -d -c 0-9
      changed_when: false
      failed_when: false
      register: discovered_apparmor_post_count

    - name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are enforcing | This flags for idempotency"
      when: discovered_apparmor_post_count.stdout | length > 0
      ansible.builtin.debug:
        msg: Changed! The profiles in /etc/apparmor.d were set to enforcing
      changed_when: true

- name: "1.3.1.4 | PATCH | Ensure apparmor_restrict_unprivileged_unconfined is enabled"
  when:
    - deb13cis_rule_1_3_1_4
    - not deb13cis_apparmor_disable
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.4
    - apparmor
  block:
    - name: "1.3.1.4 | AUDIT | Ensure apparmor_restrict_unprivileged_unconfined is enabled | find files"
      ansible.builtin.find:
        path: /etc/sysctl.d
        file_type: file
        patterns: "*.conf"
        use_regex: true
        read_whole_file: true
        contains: ^\s*apparmor_restrict_unprivileged_unconfined\s*=\s*\d
      register: discovered_apparmor_sysctl

    - name: "1.3.1.4 | AUDIT | Ensure apparmor_restrict_unprivileged_unconfined is enabled | comment out files"
      when: "item.path not /etc/sysctl.d/60-kernel_sysctl.conf"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (apparmor_restrict_unprivileged_unconfined\s*=\s*\d)
        replace: '#\1 # Commented out for CIS 1.3.1.4 - set in /etc/sysctl.d/60-kernel_sysctl.conf'
      loop: "{{ discovered_apparmor_sysctl.files }}"

    - name: "1.3.1.4 | AUDIT | Ensure apparmor_restrict_unprivileged_unconfined is enabled"
      ansible.builtin.set_fact:
        deb13cis_sysctl_update: true

    - name: "1.3.1.4 | PATCH | Ensure apparmor_restrict_unprivileged_unconfined is enabled"
      ansible.builtin.debug:
        msg: "Control being set via Handler 'update sysctl' which writes to /etc/sysctl.d/60-kernel_sysctl.conf"
