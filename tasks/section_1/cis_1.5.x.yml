- name: "1.5.3 | PATCH | Ensure kernel.yama.ptrace_scope is configured"
  when: deb13cis_rule_1_5_3 or deb13cis_rule_1_5_10
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sysctl
    - rule_1.5.3
    - rule_1.5.10
    - NIST800-53R5_CM-6
    - CCI-000366
  block:
    - name: "1.5.3 | PATCH | Ensure kernel.yama.ptrace_scope is configured"
      ansible.builtin.set_fact:
        deb13cis_sysctl_update: true

    - name: "1.5.3 | PATCH | Ensure kernel.yama.ptrace_scope is configured"
      ansible.builtin.debug:
        msg: "Control being set via Handler 'update sysctl' which writes to /etc/sysctl.d/60-kernel_sysctl.conf"

