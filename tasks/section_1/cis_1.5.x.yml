---

- name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured"
  when: deb13cis_rule_1_5_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sysctl
    - rule_1.5.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_CM-6
    - CCI-002165
    - CCI-002235
  block:
    - name: "1.5.1 | AUDIT | Ensure fs.protected_hardlinks is configured | find existing config"
      ansible.builtin.find:
        path: /etc/sysctl.d
        contains: fs.protected_hardlinks\s*=\s*(?!1)\d
      register: discovered_fs_protected_hardlinks

    - name: "1.5.1 | AUDIT | Ensure fs.protected_hardlinks is configured | check non sysctl.d files"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: discovered_hardlinks_files
      loop:
        - /etc/default/ufw
        - /etc/ufw/sysctl.conf

    - name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured | replace incorrect entries in non sysctl.d files"
      when: item.stat.exists
      ansible.builtin.replace:
        path: "{{ item.stat.path }}"
        regexp: fs.protected_hardlinks\s*=\s*\d*
        replace: ''
      loop: "{{ discovered_hardlinks_files.results }}"

    - name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured | replace incorrect entries"
      when:
        - discovered_fs_protected_hardlinks.files is defined
        - item.path != '/etc/sysctl.d/60-fs_sysctl.conf'
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: fs.protected_hardlinks\s*=\s*\d*
        replace: ""
      loop: "{{ discovered_fs_protected_hardlinks.files }}"

    - name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured | Add core limits file"
      ansible.builtin.template:
        src: etc/sysctl.d/60-fs_sysctl.conf.j2
        dest: /etc/sysctl.d/60-fs_sysctl.conf
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify: Reload sysctl

