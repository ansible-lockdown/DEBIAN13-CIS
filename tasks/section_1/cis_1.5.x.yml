- name: "1.5.6 | PATCH | Ensure prelink is not installed"
  when: deb13cis_rule_1_5_6
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sysctl
    - prelink
    - rule_1.5.6
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.6 | PATCH | Ensure prelink is not installed | Restore binaries if installed"
      when: "'prelink' in ansible_facts['packages']"
      ansible.builtin.command: "prelink -ua"
      changed_when: true

    - name: "1.5.6 | PATCH | Ensure prelink is not installed | Remove package"
      ansible.builtin.package:
        name: prelink
        state: absent

- name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured"
  when: deb13cis_rule_1_5_7
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sysctl
    - apport
    - rule_1.5.7
  block:
    - name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured | disable if installed"
      when: "'apport' in ansible_facts['packages']"
      ansible.builtin.lineinfile:
        path: /etc/default/apport
        regexp: enabled\s*=\s*(?!0)\d
        line: enabled = 0

    - name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured | mask Service"
      ansible.builtin.systemd:
        name: apport
        masked: true

    - name: "1.5.7 | PATCH | Ensure Automatic Error Reporting is configured | remove package"
      ansible.builtin.package:
        name: apport
        state: absent
        purge: "{{ deb13cis_purge_apt }}"

