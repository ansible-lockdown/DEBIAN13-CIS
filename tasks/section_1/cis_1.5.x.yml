    - level1-workstation
    - patch
    - sysctl
    - rule_1.5.3
    - rule_1.5.10
    - NIST800-53R5_CM-6
    - CCI-000366
  ansible.builtin.debug:
    msg: "This is a duplicate control in the benchmark run as part of 1.5.3"

- name: "1.5.11 | PATCH | Ensure core file size is configured | security limits"
  when: deb13cis_rule_1_5_11
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sysctl
    - rule_1.5.11
    - NIST800-53R5_CM-6
    - CCI-000366
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/60-limits.conf
    regexp: '^\* hard core'
    line: '* hard core 0'
    create: true
    owner: root
    group: root
    mode: 'u-x,go-wx'

- name: "1.5.12 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | coredump.conf"
  when: deb13cis_rule_1_5_12
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.12
    - coredump
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.12 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | coredump.d directory exists"
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        owner: root
        group: root
        mode: 'u=rwx,go-x'
        state: directory

    - name: "1.5.12 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | add coredump conf"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf.d/60-coredump.conf
        regexp: '^ProcessSizeMax'
        line: 'ProcessSizeMax=0'
        create: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify: Restart coredump

- name: "1.5.13 | PATCH | Ensure systemd-coredump Storage is configured | coredump.conf"
  when: deb13cis_rule_1_5_13
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.13
    - coredump
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.13 | PATCH | Ensure systemd-coredump Storage is configured | coredump.d directory exists"
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        owner: root
        group: root
        mode: 'u=rwx,go-x'
        state: directory

    - name: "1.5.13 | PATCH | Ensure systemd-coredump Storage is configured | coredump.conf"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf
        regexp: '^Storage'
        line: 'Storage=none'
        create: true
        owner: root
        group: root
        mode: 'u-x,go-wx'
