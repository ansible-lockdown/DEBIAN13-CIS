---
# Post tasks

- name: "POST | AUDIT | Gather the package facts after remediation"
  tags: always
  ansible.builtin.package_facts:
    manager: auto

- name: "POST | AUDIT | Check for ufw sysctl overrides"
  tags: always
  ansible.builtin.stat:
    path: /etc/ufw/sysctl.conf
  register: discovered_ufw_sysctl_conf

- name: "POST | PATCH | Align ufw log_martians overrides with sysctl.d"
  when:
    - discovered_ufw_sysctl_conf.stat.exists | default(false)
    - item.rule
  tags: always
  ansible.builtin.replace:
    path: /etc/ufw/sysctl.conf
    regexp: '^net/ipv4/conf/{{ item.scope }}/log_martians\s*=\s*0\s*$'
    replace: 'net/ipv4/conf/{{ item.scope }}/log_martians=1'
  notify: Reload sysctl
  loop:
    - {scope: 'all', rule: "{{ deb13cis_rule_3_3_1_16 }}"}
    - {scope: 'default', rule: "{{ deb13cis_rule_3_3_1_17 }}"}

- name: "POST | PATCH | Update sysctl"
  when:
    - deb13cis_sysctl_update
    - not system_is_container
    - "'procps' in ansible_facts['packages']"
  tags: always
  ansible.builtin.template:
    src: "etc/sysctl.d/{{ item }}.j2"
    dest: "/etc/sysctl.d/{{ item }}"
    owner: root
    group: root
    mode: 'u-x,go-rwx'
  notify:
    - Reload sysctl
    - Sysctl flush ipv4 route table
    - Sysctl flush ipv6 route table
  loop:
    - 60-kernel_sysctl.conf
    - 60-disable_ipv6.conf
    - 60-netipv4_sysctl.conf
    - 60-netipv6_sysctl.conf

- name: "POST | PATCH | Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "POST | PATCH |reboot system if changes require it and not skipped"
  when: change_requires_reboot
  tags: always
  vars:
    warn_control_id: Reboot_required
  block:
    - name: POST | PATCH | Reboot system if changes require it and not skipped
      when: not skip_reboot
      ansible.builtin.reboot:

    - name: "POST | WARN | Warning a reboot required but skip option set"
      when: skip_reboot
      ansible.builtin.debug:
        msg: "Warning!! changes have been made that require a reboot to be implemented but skip reboot was set - Can affect compliance check results"
      changed_when: true

    - name: "POST | WARN | Warning a reboot required but skip option set | warning count"
      when: skip_reboot
      ansible.builtin.import_tasks:
        file: warning_facts.yml
