## Changed  order as affetcng same controls
- name: "5.1.13 | PATCH | Ensure sshd post-quantum cryptography key exchange algorithms are configured"
  when:
    - deb13cis_rule_5_1_13
    - "(ansible_facts.packages['openssh-server'][0].version.split('.') | first ) is version_compare ('1:10', '>=')"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - quantum
    - rule_5.1.13
  ansible.builtin.lineinfile:
    path: "{{ deb13cis_sshd_config_file }}"
    regexp: ^KexAlgorithms ().*$
    line: KexAlgorithms {% if deb13cis_rule_5_1_12 %}mlkem768x25519-sha256,sntrup761x25519-sha512,{{ deb13cis_sshd_kex_algorithms | join(',') }}{% else %}mlkem768x25519-sha256,sntrup761x25519-sha512,\1{% endif %}
    insertbefore: ^(Include|Match)
  register: discovered_kex_ssh_updated

- name: "5.1.12 | PATCH | Ensure sshd KexAlgorithms is configured"
  when:
    - deb13cis_rule_5_1_12
    - not discovered_kex_ssh_updated is defined
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - kex
    - NIST800-53R5_SC-8
    - rule_5.1.12
  ansible.builtin.lineinfile:
    path: "{{ deb13cis_sshd_config_file }}"
    regexp: (?i)^(#?)\s*KexAlgorithms.*$
    line: "KexAlgorithms {{ deb13cis_sshd_kex_algorithms | join(',') }}"
    insertbefore: '^Include'
    validate: 'sshd -t -f %s'
  notify: Restart sshd

