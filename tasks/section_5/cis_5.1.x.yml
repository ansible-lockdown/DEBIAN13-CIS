---

- name: "5.1.1 | Ensure access to /etc/ssh/sshd_config is configured"
  when: deb13cis_rule_5_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - permissions
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - rule_5.1.1
  block:
    - name: "5.1.1 | Ensure access to /etc/ssh/sshd_config.d/ files are configured"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      loop: "{{ prelim_sshd_configs.files }}"

    - name: "5.1.1 | Ensure access to the sshd_config file is configured"
      ansible.builtin.file:
        path: "{{ deb13cis_sshd_config_file }}"
        owner: root
        group: root
        mode: 'go-rwx'

- name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured"
  when: deb13cis_rule_5_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - permissions
    - NIST800-53R5_CM-6
    - CCI-000366
    - rule_5.1.2
  block:
    - name: "5.1.2 | AUDIT | Ensure access to SSH private host key files is configured | Find the SSH private host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
        recurse: true
        file_type: any
      register: discovered_ssh_private_host_key

    - name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured | Set permissions on SSH private host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ 'ssh_keys' if (item.gr_name == 'ssh_keys') else 'root' }}"
        mode: "{{ 'u-x,g-wx,o-rwx' if (item.gr_name == 'ssh_keys') else 'u-x,go-rwx' }}"
      loop: "{{ discovered_ssh_private_host_key.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured"
  when: deb13cis_rule_5_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_AC-3
    - NIST800-53R5_CM-6
    - NIST800-53R5_MP-2
    - rule_5.1.3
  block:
    - name: "5.1.3 | AUDIT | Ensure access to SSH public host key files is configured | Find the SSH public host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
        recurse: true
        file_type: any
      register: discovered_ssh_public_host_key

    - name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured | Set permissions on SSH public host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop: "{{ discovered_ssh_public_host_key.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.4 | PATCH | Ensure sshd access is configured"
  when:
    - deb13cis_rule_5_1_4
    - deb13cis_sshd_limited
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - rule_5.1.4
  block:
    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for allow users"
      when: "deb13cis_sshd_allow_users | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: "^AllowUsers"
        line: AllowUsers {{ deb13cis_sshd_allow_users }}
        insertbefore: ^(Include|Match)
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for allow groups"
      when: "deb13cis_sshd_allow_groups | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: "^AllowGroups"
        line: AllowGroups {{ deb13cis_sshd_allow_groups }}
        insertbefore: ^(Include|Match)
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for deny users"
      when: "deb13cis_sshd_deny_users | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: "^DenyUsers"
        line: DenyUsers {{ deb13cis_sshd_deny_users }}
        insertbefore: ^(Include|Match)
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for deny groups"
      when: "deb13cis_sshd_deny_groups | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: "^DenyGroups"
        line: DenyGroups {{ deb13cis_sshd_deny_groups }}
        insertbefore: ^(Include|Match)
      notify: Restart sshd

- name: "5.1.5 | PATCH | Ensure sshd Banner is configured"
  when: deb13cis_rule_5_1_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_5.1.5
  notify: Restart sshd
  ansible.builtin.lineinfile:
    path: "{{ deb13cis_sshd_config_file }}"
    regexp: ^(#?)\s*Banner.*$
    line: Banner /etc/issue.net
    insertbefore: ^(Include|Match)

- name: "5.1.6 | PATCH | Ensure sshd Ciphers are configured"
  when: deb13cis_rule_5_1_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - crypto
    - rule_5.1.6
    - NIST800-53R5_SC-8
  vars:
    warn_control_id: "5.1.6"
  block:
    - name: "5.1.6 | AUDIT | Ensure sshd Ciphers are configured | Check state"
      ansible.builtin.shell: sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se)\b'
      changed_when: false
      failed_when: false
      register: discovered_loaded_ciphers

    - name: "5.1.6 | AUDIT| Ensure sshd Ciphers are configured | Check state"
      when: discovered_loaded_ciphers.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! You have weak ciphers accepted on your system please investigate"

    - name: "5.1.6 | AUDIT| Ensure sshd Ciphers are configured | Check state"
      when: discovered_loaded_ciphers.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml

    - name: "5.1.6 | PATCH | Ensure sshd Ciphers are configured | disable chacha20 unload"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: ^Ciphers ((!?chacha20-poly1305@openssh.com).*)
        backrefs: true
        line: Ciphers -chacha20-poly1305@openssh \1
      notify: Restart sshd

- name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured"
  when: deb13cis_rule_5_1_7
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_5.1.7
  notify: Restart sshd
  block:
    - name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured | Add line in sshd_config for ClientAliveInterval"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: '^ClientAliveInterval'
        line: "ClientAliveInterval {{ deb13cis_sshd_client_alive_interval }}"
        validate: sshd -t -f %s

    - name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured | Ensure SSH ClientAliveCountMax set to <= 3"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: '^ClientAliveCountMax'
        line: "ClientAliveCountMax {{ deb13cis_sshd_client_alive_count_max }}"
        validate: sshd -t -f %s
        insertbefore: ^(Include|Match)

- name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
  when: deb13cis_rule_5_1_8
  tags:
    - level2-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_CM-7
    - rule_5.1.8
  block:
    - name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
      ansible.builtin.replace:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: (?i)^(#?)\s*DisableForwarding (no|false)
        replace: 'DisableForwarding yes'
        validate: sshd -t -f %s

    - name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
      ansible.builtin.lineinfile:
        path: "{{ deb13cis_sshd_config_file }}"
        line: 'DisableForwarding yes'
        validate: sshd -t -f %s
        insertbefore: ^Include

    - name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled | ensure x11 disabled"
      ansible.builtin.replace:
        path: "{{ deb13cis_sshd_config_file }}"
        regexp: (?i)^\s*X11Forwarding\s*(yes|no)
        replace: '# X11Forwarding no'
        validate: sshd -t -f %s

