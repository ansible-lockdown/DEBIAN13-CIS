---

- name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use"
  when: deb13cis_rule_2_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_2.3.1.1
    - chrony
    - ntp
    - systemd-timesyncd
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
  block:
    - name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use | Pkg installed"
      ansible.builtin.package:
        name: "{{ deb13cis_time_sync_tool }}"
        state: present
        lock_timeout: "{{ deb13cis_apt_lock_timeout }}"

    - name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use | other pkgs removed"
      when: item != deb13cis_time_sync_tool
      ansible.builtin.package:
        name: "{{ item }}"
        state: absent
        purge: "{{ deb13cis_purge_apt }}"
        lock_timeout: "{{ deb13cis_apt_lock_timeout }}"
      loop:
        - chrony
        - ntp

    - name: "2.3.1.1 | PATCH | Ensure a single time synchronization daemon is in use | mask service"
      when:
        - deb13cis_time_sync_tool != "systemd-timesyncd"
        - "'systemd-timesyncd' in ansible_facts['packages']"
      ansible.builtin.service:
        name: systemd-timesyncd
        masked: true
        daemon_reload: true
