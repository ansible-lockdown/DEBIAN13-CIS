---

- name: "6.2.4.1 | PATCH | Ensure audit log files mode is configured"
  when: deb13cis_rule_6_2_4_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - auditd
    - rule_6.2.4.1
    - NIST800-53R5_AU-3
  block:
    - name: "6.2.4.1 | AUDIT | Ensure audit log files mode is configured | find logfiles"
      ansible.builtin.find:
        path: "{{ prelim_auditd_logfile.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logfile_modes

    - name: "6.2.4.1 | PATCH | Ensure audit log files mode is configured"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: 'u-x,g-wx,o-rwx'
      loop: "{{ discovered_auditd_logfile_modes.files }}"

- name: "6.2.4.2 | PATCH | Ensure audit log files owner is configured"
  when: deb13cis_rule_6_2_4_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - auditd
    - rule_6.2.4.2
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ prelim_auditd_logfile.stdout | dirname }}"
    recurse: true
    owner: root

- name: "6.2.4.3 | PATCH | Ensure audit log files group owner is configured"
  when: deb13cis_rule_6_2_4_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - auditd
    - rule_6.2.4.3
    - NIST800-53R5_AU-3
  block:
    - name: "6.2.4.3 | AUDIT | Ensure audit log files group owner is configured | stat logfile"
      ansible.builtin.find:
        path: "{{ prelim_auditd_logfile.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logs

    - name: "6.2.4.3 | PATCH | Ensure audit log files group owner is configured"
      when: item.gr_name not in [ 'root', 'adm' ]
      ansible.builtin.file:
        path: "{{ item.path }}"
        group: root
      loop: "{{ discovered_auditd_logs.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "6.2.4.4 | PATCH | Ensure the audit log file directory mode is configured"
  when: deb13cis_rule_6_2_4_4
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.4
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ prelim_auditd_logfile.stdout | dirname }}"
    state: directory
    mode: 'u+rwx,g+rx,g-w,o-rwx'

- name: "6.2.4.5 | PATCH | Ensure audit configuration files mode is configured"
  when: deb13cis_rule_6_2_4_5
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.5
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: 'u-x,g-wx,o-rwx'
  failed_when: discovered_auditd_file_list.state not in '[ file, absent ]'
  register: discovered_auditd_file_list
  loop: "{{ prelim_auditd_conf_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.2.4.6 | PATCH | Ensure audit configuration files owner is configured"
  when: deb13cis_rule_6_2_4_6
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.6
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
  loop: "{{ prelim_auditd_conf_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.2.4.7 | PATCH | Ensure audit configuration files group owner is configured"
  when: deb13cis_rule_6_2_4_7
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.7
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: root
  loop: "{{ prelim_auditd_conf_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.2.4.8 | PATCH | Ensure audit tools mode is configured"
  when: deb13cis_rule_6_2_4_8
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.8
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item }}"
    mode: 'go-w'
  loop: "{{ audit_bins }}"

- name: "6.2.4.9 | PATCH | Ensure audit tools owner is configured"
  when: deb13cis_rule_6_2_4_9
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.9
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
  loop: "{{ audit_bins }}"

- name: "6.2.4.10 | PATCH | Ensure audit tools group owner is configured"
  when: deb13cis_rule_6_2_4_10
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.2.4.10
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: "{{ item }}"
    group: root
  loop: "{{ audit_bins }}"
