---

- name: "6.1.1.2.1 | PATCH | Ensure systemd-journal-remote is installed"
  when:
    - deb13cis_rule_6_1_1_2_1
    - not deb13cis_system_is_log_server
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.2.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.package:
    name: systemd-journal-remote
    state: present
    lock_timeout: "{{ deb13cis_apt_lock_timeout }}"

- name: "6.1.1.2.2 | PATCH | Ensure systemd-journal-upload authentication is configured"
  when:
    - deb13cis_rule_6_1_1_2_2
    - not deb13cis_system_is_log_server
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.2.2
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
  ansible.builtin.lineinfile:
    path: /etc/systemd/journal-upload.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: 'URL=', line: 'URL={{ deb13cis_journal_upload_url }}'}
    - { regexp: 'ServerKeyFile=', line: 'ServerKeyFile={{ deb13cis_journal_upload_serverkeyfile }}'}
    - { regexp: 'ServerCertificateFile=', line: 'ServerCertificateFile={{ deb13cis_journal_servercertificatefile }}'}
    - { regexp: 'TrustedCertificateFile=', line: 'TrustedCertificateFile={{ deb13cis_journal_trustedcertificatefile }}'}
  notify: Restart systemd_journal_upload

- name: "6.1.1.2.3 | PATCH | Ensure systemd-journal-upload is enabled and active"
  when:
    - not deb13cis_system_is_log_server
    - deb13cis_rule_6_1_1_2_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.2.3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: systemd-journal-upload
    masked: false
    enabled: true
    state: started

- name: "6.1.1.2.4 | PATCH | Ensure systemd-journal-remote service is not in use"
  when:
    - not deb13cis_system_is_log_server
    - deb13cis_rule_6_1_1_2_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.2.4
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service
